<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme:light dark; --bg:#faf7f2; --ink:#302e2b; --muted:#89847c; --bubble:#ede9e1; --line:#ded9d0; --code:#efebe4; --clay:#bf6042 }
@media(prefers-color-scheme:dark){:root{--bg:#242422;--ink:#e4e1d9;--muted:#a09a90;--bubble:#32322e;--line:#44433e;--code:#2e2e2a;--clay:#dc9478}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;overflow-wrap:anywhere}
main{max-width:850px;margin:auto;padding:32px 38px 70px}.message{margin-bottom:34px}.meta{font:11px/1.4 -apple-system,sans-serif;color:var(--muted);display:flex;align-items:center;gap:8px;margin:0 0 10px}.name{font-weight:650;color:var(--ink);font-size:12px}.spark{color:var(--clay);font-size:23px;line-height:20px}.time{margin-left:auto;font-size:10px;opacity:.75}
.user{margin-left:36px}.user .body{background:var(--bubble);border-radius:17px;padding:15px 20px}.user .meta{padding-left:5px}.assistant .body{padding:0 2px}.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}
p{margin:0 0 15px;white-space:pre-wrap}h1,h2,h3,h4,h5,h6{font-family:Georgia,serif;font-weight:500;line-height:1.35;margin:24px 0 12px}h1{font-size:27px}h2{font-size:23px}h3{font-size:19px}h4,h5,h6{font-size:17px}
a{color:var(--clay);text-decoration:underline;text-underline-offset:3px}strong{font-weight:650}code{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:2px 5px;border-radius:4px}pre{overflow:auto;background:var(--code);border:1px solid var(--line);border-radius:9px;padding:16px;margin:17px 0;white-space:pre;overflow-wrap:normal}pre code{padding:0;background:transparent;line-height:1.7}.code-head{display:flex;justify-content:space-between;color:var(--muted);font:10px -apple-system,sans-serif;margin-bottom:10px;min-height:12px}
ul,ol{padding-left:25px;margin:10px 0 17px}li{margin:5px 0}li p{margin:0}blockquote{border-left:3px solid var(--clay);padding-left:16px;margin:17px 0;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:25px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;font-size:13px;width:100%;margin:12px 0 20px}th,td{text-align:left;border:1px solid var(--line);padding:8px 12px;min-width:70px}th{background:var(--code);font-weight:600}
.images{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.images img{max-width:100%;max-height:440px;border-radius:10px;object-fit:contain;border:1px solid var(--line)}.missing{color:var(--muted);font-size:12px;padding:18px;border:1px dashed var(--line);border-radius:8px}.tools{margin:14px 0;color:var(--muted);font-size:12px}.tools details{border:1px solid var(--line);border-radius:8px;margin:7px 0;padding:9px 12px}.tools summary{cursor:pointer}.tools pre{font-size:11px;max-height:400px;margin-bottom:0}.tools p{font-size:11px;margin:8px 0 0}.end{text-align:center;font-size:11px;color:var(--muted);margin-top:50px}.empty{text-align:center;color:var(--muted);padding-top:80px}mark{background:#edcb7099;color:inherit;border-radius:2px}.search-status{position:sticky;top:10px;z-index:2;background:var(--bubble);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:9px;margin-bottom:28px}button{border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);padding:3px 9px;cursor:pointer}button:focus-visible{outline:2px solid var(--clay)}.search-status .count{margin-right:auto}
@media(max-width:600px){main{padding:24px 22px 60px}.user{margin-left:15px}}
</style></head><body><main id="chat" aria-label="Conversation"></main>
<script>
const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__PAYLOAD__'),c=>c.charCodeAt(0))));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(raw){
 const tokens=[];const hold=s=>`\u0001${tokens.push(s)-1}\u0001`;
 let s=esc(raw).replace(/`([^`]+)`/g,(_,v)=>hold('<code>'+v+'</code>'));
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,(_,label,url)=>hold('<a href="'+url+'">'+label+'</a>'));
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
 s=s.replace(/(^|\s)\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');
 for(let i=tokens.length-1;i>=0;i--)s=s.split(`\u0001${i}\u0001`).join(tokens[i]);
 return s;
}
function markdown(text){
 const lines=text.replace(/\r\n/g,'\n').split('\n');let out='',i=0;
 while(i<lines.length){const line=lines[i];
  if(/^\s*(```|~~~)/.test(line)){const fence=line.trim().slice(0,3),lang=line.trim().slice(3);let code=[];i++;while(i<lines.length&&!lines[i].trim().startsWith(fence)){code.push(lines[i++])}i++;out+='<pre><div class="code-head">'+esc(lang)+'</div><code>'+esc(code.join('\n'))+'</code></pre>';continue}
  if(!line.trim()){i++;continue}
  if(/^#{1,6}\s/.test(line)){const n=line.match(/^#+/)[0].length;out+=`<h${n}>${inline(line.slice(n).trim())}</h${n}>`;i++;continue}
  if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)){out+='<hr>';i++;continue}
  if(/^\s*>/.test(line)){let q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));out+='<blockquote>'+markdown(q.join('\n'))+'</blockquote>';continue}
  if(i+1<lines.length&&line.includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());out+='<div class="table-wrap"><table><thead><tr>'+cells(line).map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){out+='<tr>'+cells(lines[i++]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>'}out+='</tbody></table></div>';continue}
  const list=line.match(/^\s*([-*+]|\d+[.)])\s+(.+)/);if(list){const ordered=/\d/.test(list[1]),tag=ordered?'ol':'ul';out+='<'+tag+'>';while(i<lines.length){const item=lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.+)/);if(!item||/\d/.test(item[1])!==ordered)break;out+='<li>'+inline(item[2])+'</li>';i++}out+='</'+tag+'>';continue}
  let p=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^\s*(#{1,6}\s|```|~~~|>|[-*+]\s|\d+[.)]\s)/.test(lines[i])){if(i+1<lines.length&&lines[i].includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1]))break;p.push(lines[i++])}out+='<p>'+inline(p.join('\n'))+'</p>';
 }
 return out;
}
const chat=document.getElementById('chat');
if(!payload.messages.length)chat.innerHTML='<div class="empty">No displayable messages. Turn on tool records to inspect this session.</div>';
for(const m of payload.messages){const section=document.createElement('article');section.className='message '+(m.role==='user'?'user':'assistant');
 let date='';if(m.timestamp){const d=new Date(m.timestamp);if(!isNaN(d))date=d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
 section.innerHTML='<div class="meta">'+(m.role==='assistant'?'<span class="spark" aria-hidden="true">✳</span>':'')+'<span class="name">'+(m.role==='user'?'You':'Claude')+'</span><time class="time">'+esc(date)+'</time></div><div class="body">'+markdown(m.text)+'</div>';
 if(m.images.length){const images=document.createElement('div');images.className='images';for(const im of m.images){if(im.url){const img=document.createElement('img');img.src=im.url;img.alt='Conversation attachment';img.loading='lazy';images.append(img)}else{const missing=document.createElement('div');missing.className='missing';missing.textContent=im.missing;images.append(missing)}}section.querySelector('.body').append(images)}
 if(m.tools.length){const tools=document.createElement('div');tools.className='tools';for(const t of m.tools){const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent=t.name;detail.append(summary);const pre=document.createElement('pre');pre.textContent=t.text;detail.append(pre);if(t.truncated){const note=document.createElement('p');note.textContent='Preview shortened. The archive preserves the complete record.';detail.append(note)}tools.append(detail)}section.append(tools)}chat.append(section);
}
if(payload.messages.length){const end=document.createElement('div');end.className='end';end.textContent='End of saved conversation';chat.append(end)}
if(payload.query.trim()){
 const needle=payload.query.trim().toLowerCase(),walker=document.createTreeWalker(chat,NodeFilter.SHOW_TEXT),nodes=[];let node;
 while(node=walker.nextNode())if(node.parentElement.closest('.body')&&!node.parentElement.closest('script,style'))nodes.push(node);
 const marks=[];for(const node of nodes){const text=node.textContent,lower=text.toLowerCase();let start=0,index=lower.indexOf(needle);if(index<0)continue;const fragment=document.createDocumentFragment();while(index>=0){fragment.append(document.createTextNode(text.slice(start,index)));const mark=document.createElement('mark');mark.textContent=text.slice(index,index+needle.length);fragment.append(mark);marks.push(mark);start=index+needle.length;index=lower.indexOf(needle,start)}fragment.append(document.createTextNode(text.slice(start)));node.replaceWith(fragment)}
 const status=document.createElement('nav');status.className='search-status';const count=document.createElement('span');count.className='count';let current=0;const update=()=>{count.textContent=marks.length?`${current+1} of ${marks.length} matches`:'No message matches (title or project matched)'};update();status.append(count);for(const [label,delta]of[['Previous',-1],['Next',1]]){const b=document.createElement('button');b.textContent=label;b.disabled=!marks.length;b.onclick=()=>{current=(current+delta+marks.length)%marks.length;update();marks[current].scrollIntoView({block:'center',behavior:'smooth'})};status.append(b)}chat.prepend(status);if(marks.length)setTimeout(()=>marks[0].scrollIntoView({block:'center'}),100);
}
</script></body></html>
